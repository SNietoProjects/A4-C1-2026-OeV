<style>
  :root{--naranja:#d97706;--naranja-claro:#fef3c7;--naranja-borde:#f59e0b;--azul-oscuro:#1e293b;--texto:#374151;--texto-suave:#6b7280;--borde:#e5e7eb;--fondo:#fafaf9;--blanco:#ffffff;--verde:#166534;--verde-bg:#f0fdf4;--verde-borde:#86efac;--rojo:#991b1b;--rojo-bg:#fef2f2;--rojo-borde:#fca5a5;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Source Sans 3',sans-serif;background:var(--fondo);color:var(--texto);min-height:100vh;font-size:16px;line-height:1.6;}
  header{background:var(--blanco);border-bottom:1px solid var(--borde);}
  .header-top{max-width:860px;margin:0 auto;padding:1.4rem 1.5rem 1rem;display:flex;align-items:flex-start;gap:1.2rem;}
  .header-logo{width:48px;height:48px;border-radius:8px;object-fit:contain;flex-shrink:0;}
  .header-textos{flex:1;}
  .header-site{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--naranja);font-weight:600;margin-bottom:3px;}
  .header-titulo{font-family:'Lora',serif;font-size:clamp(1.2rem,3.5vw,1.7rem);font-weight:700;color:var(--azul-oscuro);line-height:1.2;}
  .header-sub{font-size:0.88rem;color:var(--texto-suave);margin-top:4px;}
  .header-meta{background:var(--naranja-claro);border-top:1px solid #fde68a;padding:0.55rem 1.5rem;}
  .header-meta-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;font-size:0.83rem;color:#92400e;font-weight:500;}
  .barra-wrap{position:sticky;top:0;z-index:100;background:var(--blanco);border-bottom:1px solid var(--borde);padding:0.6rem 1.5rem;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
  .barra-inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:1rem;}
  .barra-track{flex:1;height:6px;background:#f3f4f6;border-radius:99px;overflow:hidden;}
  .barra-fill{height:100%;background:var(--naranja);border-radius:99px;transition:width 0.35s ease;width:0%;}
  .barra-num{font-size:13px;font-weight:600;color:var(--azul-oscuro);white-space:nowrap;min-width:52px;}
  .barra-score{font-size:13px;color:var(--texto-suave);white-space:nowrap;}
  .barra-score .ok{color:var(--verde);font-weight:600;}
  .barra-score .ko{color:var(--rojo);font-weight:600;}
  main{max-width:860px;margin:0 auto;padding:2rem 1.5rem 5rem;}
  .card{background:var(--blanco);border:1px solid var(--borde);border-radius:10px;padding:1.5rem 1.6rem;margin-bottom:1.4rem;transition:box-shadow 0.2s;}
  .card:hover{box-shadow:0 3px 14px rgba(0,0,0,0.06);}
  .card-num{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--naranja);margin-bottom:0.5rem;}
  .card-pregunta{font-family:'Lora',serif;font-size:1rem;font-weight:600;line-height:1.55;color:var(--azul-oscuro);margin-bottom:1.1rem;}
  .opciones{display:flex;flex-direction:column;gap:0.45rem;}
  .opcion{display:flex;align-items:flex-start;gap:0.7rem;padding:0.7rem 1rem;border:1.5px solid var(--borde);border-radius:7px;cursor:pointer;background:var(--blanco);text-align:left;font-family:'Source Sans 3',sans-serif;font-size:0.93rem;color:var(--texto);line-height:1.5;transition:border-color 0.15s,background 0.15s;width:100%;}
  .opcion:hover:not(:disabled){border-color:var(--naranja-borde);background:var(--naranja-claro);}
  .opcion .letra{font-weight:700;color:var(--naranja);min-width:18px;font-size:0.85rem;margin-top:2px;flex-shrink:0;}
  .opcion.correcta{border-color:var(--verde-borde);background:var(--verde-bg);color:var(--verde);}
  .opcion.correcta .letra{color:#15803d;}
  .opcion.incorrecta{border-color:var(--rojo-borde);background:var(--rojo-bg);color:var(--rojo);}
  .opcion.incorrecta .letra{color:var(--rojo);}
  .opcion:disabled{cursor:default;}
  .explicacion{display:none;margin-top:1rem;padding:0.9rem 1rem 0.9rem 1.1rem;background:#fffbeb;border-left:3px solid var(--naranja);border-radius:0 6px 6px 0;font-size:0.875rem;line-height:1.65;color:var(--texto);}
  .explicacion.visible{display:block;animation:fadeIn 0.22s ease;}
  .explicacion strong{color:var(--azul-oscuro);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-5px);}to{opacity:1;transform:translateY(0);}}
  .resultado{display:none;background:var(--blanco);border:1px solid var(--borde);border-radius:12px;padding:2.5rem 2rem 2rem;margin:1.5rem 0 2rem;text-align:center;}
  .resultado.visible{display:block;animation:fadeIn 0.3s ease;}
  .resultado-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--naranja);font-weight:600;margin-bottom:0.5rem;}
  .resultado h2{font-family:'Lora',serif;font-size:1.75rem;font-weight:700;color:var(--azul-oscuro);margin-bottom:0.3rem;}
  .resultado-nota{font-size:3.2rem;font-weight:700;color:var(--azul-oscuro);line-height:1;margin:1rem 0 0.3rem;font-family:'Lora',serif;}
  .resultado-nota span{color:var(--naranja);}
  .calif-badge{display:inline-block;padding:5px 16px;border-radius:99px;font-size:0.9rem;font-weight:600;margin:0.6rem 0 1.5rem;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:0 0 1.5rem;}
  .stat{background:var(--fondo);border:1px solid var(--borde);border-radius:8px;padding:0.9rem 0.5rem;}
  .stat-num{font-size:1.9rem;font-weight:700;font-family:'Lora',serif;}
  .stat-lab{font-size:0.78rem;color:var(--texto-suave);margin-top:2px;}
  .resultado-hint{font-size:0.85rem;color:var(--texto-suave);margin-bottom:1.2rem;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:0.7rem 1.6rem;border-radius:7px;font-family:'Source Sans 3',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;border:none;transition:all 0.18s;}
  .btn-naranja{background:var(--naranja);color:white;}
  .btn-naranja:hover{background:#b45309;transform:translateY(-1px);}
  .divider{text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--texto-suave);margin:2rem 0 1.5rem;display:flex;align-items:center;gap:1rem;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--borde);}
  @media(max-width:580px){main{padding:1.2rem 1rem 4rem;}.card{padding:1.1rem;}.stats{grid-template-columns:1fr 1fr;}.header-top{padding:1rem;gap:0.8rem;}.header-meta{padding:0.5rem 1rem;}}
</style>

<script>
const BANCO = [
  // ── TÍTULO VI: EL PODER JUDICIAL ──
  {
    p: "El artículo 117.1 CE define la naturaleza de la justicia y de quienes la administran. ¿Cuáles son las cuatro características que la Constitución atribuye a los Jueces y Magistrados?",
    ops: ["Imparciales, inamovibles, responsables y sometidos a la ley y a la Constitución", "Independientes, inamovibles, responsables y sometidos únicamente al imperio de la ley", "Independientes, imparciales, inamovibles y sometidos al Consejo General del Poder Judicial", "Neutrales, independientes, inamovibles y responsables únicamente ante el Tribunal Supremo"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 117.1 CE establece que los Jueces y Magistrados son «independientes, inamovibles, responsables y sometidos únicamente al imperio de la ley». Son cuatro notas esenciales: independencia (no dependen de nadie), inamovilidad (no pueden ser removidos arbitrariamente), responsabilidad (responden de sus actos) y sumisión exclusiva a la ley."
  },
  {
    p: "Según el artículo 117.1 CE, ¿en nombre de quién se administra la justicia?",
    ops: ["En nombre del Estado español y del pueblo que lo constituye", "En nombre del Rey", "En nombre de las Cortes Generales como representantes de la soberanía popular", "En nombre del Tribunal Supremo como órgano jurisdiccional superior"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 117.1 CE establece que la justicia «se administra en nombre del Rey por Jueces y Magistrados». Esta fórmula es de carácter protocolario y simbólico, y no implica que el Rey intervenga en la administración de justicia, función que corresponde exclusivamente a los jueces."
  },
  {
    p: "El artículo 117.2 CE garantiza la inamovilidad de los jueces. ¿En qué circunstancias pueden ser separados, suspendidos, trasladados o jubilados?",
    ops: ["Nunca; la inamovilidad es absoluta durante todo su mandato", "Solo por alguna de las causas y con las garantías previstas en la ley", "Por decisión motivada del Consejo General del Poder Judicial con ratificación del Tribunal Supremo", "Por acuerdo del Gobierno con informe preceptivo del Consejo de Estado"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 117.2 CE establece que los Jueces y Magistrados «no podrán ser separados, suspendidos, trasladados ni jubilados, sino por alguna de las causas y con las garantías previstas en la ley». La inamovilidad no es absoluta: admite excepciones tasadas por la ley, garantizando así la independencia judicial frente a presiones externas."
  },
  {
    p: "El artículo 117.3 CE atribuye en exclusiva la potestad jurisdiccional a determinados órganos. ¿Cuáles son y qué comprende esa potestad?",
    ops: ["Al Tribunal Supremo y los Tribunales Superiores de Justicia; comprende dictar sentencias y hacer cumplir las resoluciones firmes", "A los Juzgados y Tribunales determinados por las leyes; comprende juzgar y hacer ejecutar lo juzgado en todo tipo de procesos", "Al Tribunal Constitucional y al Tribunal Supremo; comprende interpretar las leyes y resolver los recursos de casación", "A los órganos jurisdiccionales y al Ministerio Fiscal; comprende la investigación del delito y el ejercicio de la acción penal"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 117.3 CE establece que «el ejercicio de la potestad jurisdiccional en todo tipo de procesos, juzgando y haciendo ejecutar lo juzgado, corresponde exclusivamente a los Juzgados y Tribunales determinados por las leyes». La potestad jurisdiccional tiene dos facetas: juzgar (fase declarativa) y ejecutar lo juzgado (fase ejecutiva)."
  },
  {
    p: "El artículo 117.4 CE prohíbe que los Juzgados y Tribunales ejerzan funciones distintas de las jurisdiccionales, salvo una excepción. ¿Cuál es?",
    ops: ["Las funciones notariales y registrales cuando la ley así lo establezca", "Las que expresamente les sean atribuidas por ley en garantía de cualquier derecho", "Las funciones de mediación y arbitraje en conflictos civiles y mercantiles", "Las funciones administrativas propias del Registro Civil"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 117.4 CE establece que los Juzgados y Tribunales «no ejercerán más funciones que las señaladas en el apartado anterior y las que expresamente les sean atribuidas por ley en garantía de cualquier derecho». Esta excepción permite atribuirles funciones de jurisdicción voluntaria, siempre que la ley así lo prevea explícitamente."
  },
  {
    p: "El artículo 117.5 CE consagra un principio fundamental de la organización judicial española. ¿De qué principio se trata y qué excepción admite?",
    ops: ["Principio de independencia judicial; admite excepciones para el Tribunal Constitucional", "Principio de unidad jurisdiccional; admite la jurisdicción militar en el ámbito estrictamente castrense y en estado de sitio", "Principio de exclusividad jurisdiccional; admite el arbitraje privado regulado por ley", "Principio de reserva jurisdiccional; admite los Tribunales consuetudinarios reconocidos por la CE"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 117.5 CE establece que «el principio de unidad jurisdiccional es la base de la organización y funcionamiento de los Tribunales». La única excepción expresamente prevista es la jurisdicción militar, que la ley regulará «en el ámbito estrictamente castrense y en los supuestos de estado de sitio»."
  },
  {
    p: "El artículo 117.6 CE contiene una prohibición absoluta. ¿Qué prohíbe?",
    ops: ["Los tribunales arbitrales con funciones equivalentes a los judiciales", "Los Tribunales de excepción", "Los Tribunales especiales para aforados sin competencia de la Sala Penal del TS", "Los juicios en ausencia sin garantías de defensa adecuadas"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 117.6 CE establece de forma rotunda: «Se prohíben los Tribunales de excepción». Esta prohibición garantiza el derecho al juez ordinario predeterminado por la ley (art. 24.2 CE) y evita la creación de tribunales ad hoc para juzgar casos concretos o personas determinadas."
  },
  {
    p: "El artículo 118 CE establece la obligación de cumplir las resoluciones judiciales. ¿A quién se dirige esta obligación?",
    ops: ["Solo a los poderes públicos y a las Administraciones Públicas", "A todos, estando obligados a cumplir las sentencias y resoluciones firmes y a prestar la colaboración requerida por los jueces en el proceso y en la ejecución", "Únicamente a los ciudadanos que sean parte en el proceso judicial", "Solo a los funcionarios públicos que actúen en el ejercicio de sus funciones"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 118 CE establece que «es obligado cumplir las sentencias y demás resoluciones firmes de los Jueces y Tribunales, así como prestar la colaboración requerida por éstos en el curso del proceso y en la ejecución de lo resuelto». La obligación es universal: alcanza a ciudadanos, instituciones y poderes públicos."
  },
  {
    p: "El artículo 119 CE reconoce el derecho a la justicia gratuita. ¿En qué supuestos garantiza la CE que la justicia será gratuita?",
    ops: ["Siempre que así lo solicite el ciudadano, sin necesidad de acreditar ningún requisito económico", "Cuando así lo disponga la ley y, en todo caso, respecto de quienes acrediten insuficiencia de recursos para litigar", "Solo en el orden penal para los acusados que no puedan costearse defensa letrada", "Únicamente para los menores de edad y las personas con discapacidad reconocida"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 119 CE establece una doble garantía: la justicia será gratuita cuando «así lo disponga la ley» (supuestos legales de gratuidad) y «en todo caso» respecto de quienes «acrediten insuficiencia de recursos para litigar» (derecho subjetivo condicionado a la acreditación de precariedad económica)."
  },
  {
    p: "Según el artículo 120.1 CE, ¿cuál es la regla general sobre la publicidad de las actuaciones judiciales?",
    ops: ["Las actuaciones judiciales serán siempre secretas para garantizar la presunción de inocencia", "Las actuaciones judiciales serán públicas, con las excepciones que prevean las leyes de procedimiento", "Solo serán públicas las vistas orales en materia civil y penal, nunca las instrucciones sumariales", "La publicidad es un derecho renunciable de las partes, que pueden solicitar el secreto del proceso"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 120.1 CE establece que «las actuaciones judiciales serán públicas, con las excepciones que prevean las leyes de procedimiento». La publicidad es la regla y el secreto la excepción, que solo puede establecerse por ley y no por decisión discrecional del juez."
  },
  {
    p: "El artículo 120.2 CE establece un principio sobre la forma del procedimiento judicial. ¿Cuál es y en qué materia resulta especialmente aplicable?",
    ops: ["El procedimiento será predominantemente escrito, sobre todo en materia civil y contencioso-administrativa", "El procedimiento será predominantemente oral, sobre todo en materia criminal", "El procedimiento será siempre oral y público, sin excepción en ningún orden jurisdiccional", "El procedimiento será oral en primera instancia y escrito en los recursos de apelación y casación"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 120.2 CE establece que «el procedimiento será predominantemente oral, sobre todo en materia criminal». No impone la oralidad absoluta —dice «predominantemente»— pero sí marca una directriz constitucional especialmente relevante en el proceso penal."
  },
  {
    p: "El artículo 120.3 CE establece dos requisitos para las sentencias. ¿Cuáles son?",
    ops: ["Deberán ser razonadas y notificadas a todas las partes en el plazo máximo legal", "Serán siempre motivadas y se pronunciarán en audiencia pública", "Deberán ser escritas y publicadas en el Boletín Oficial correspondiente", "Serán motivadas, recurribles y dictadas dentro del plazo legalmente establecido"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 120.3 CE establece que «las sentencias serán siempre motivadas y se pronunciarán en audiencia pública». La motivación es una exigencia constitucional que conecta con el derecho a la tutela judicial efectiva (art. 24.1 CE) y la interdicción de la arbitrariedad (art. 9.3 CE)."
  },
  {
    p: "El artículo 121 CE reconoce la responsabilidad del Estado por el funcionamiento de la Administración de Justicia. ¿En qué dos supuestos procede la indemnización?",
    ops: ["Por retrasos injustificados en la resolución de asuntos y por condenas erróneas en el proceso penal", "Por error judicial y por el funcionamiento anormal de la Administración de Justicia", "Por vulneración de derechos fundamentales en el proceso y por incumplimiento de plazos procesales", "Por prisión provisional indebida y por dilaciones indebidas del proceso"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 121 CE establece que «los daños causados por error judicial, así como los que sean consecuencia del funcionamiento anormal de la Administración de Justicia, darán derecho a una indemnización a cargo del Estado». Son dos títulos distintos de responsabilidad: el error judicial (resolución equivocada) y el funcionamiento anormal (dilaciones, deficiencias organizativas)."
  },
  {
    p: "El Consejo General del Poder Judicial (CGPJ) se regula en el artículo 122.2 y 122.3 CE. ¿Cuántos miembros lo integran y cuántos años dura su mandato?",
    ops: ["Doce miembros nombrados por el Rey por un período de cuatro años", "Veintiún miembros nombrados por el Rey por un período de cinco años", "Veinte miembros nombrados por el Rey por un período de cinco años, más el Presidente del TS que lo preside", "Dieciocho miembros nombrados por las Cortes por un período de seis años"],
    c: 2,
    exp: "<strong>Respuesta correcta: C.</strong> El art. 122.3 CE establece que el CGPJ está integrado por el Presidente del Tribunal Supremo, que lo presidirá, y por veinte miembros nombrados por el Rey por un período de cinco años. En total son 21 personas (el Presidente del TS más los 20 vocales)."
  },
  {
    p: "De los 20 vocales del CGPJ nombrados por el Rey, ¿cómo se distribuyen según el artículo 122.3 CE?",
    ops: ["Doce propuestos por el Congreso y ocho por el Senado, todos entre jueces y magistrados", "Doce entre jueces y magistrados de todas las categorías; cuatro a propuesta del Congreso y cuatro a propuesta del Senado, estos últimos entre abogados y juristas con más de 15 años de ejercicio", "Diez propuestos por las Cortes, seis por el Gobierno y cuatro por el propio Poder Judicial", "Ocho propuestos por el Congreso, ocho por el Senado y cuatro por el Tribunal Supremo"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 122.3 CE establece que de los 20 vocales: doce son elegidos entre Jueces y Magistrados de todas las categorías judiciales; cuatro a propuesta del Congreso y cuatro a propuesta del Senado, elegidos en ambos casos por mayoría de tres quintos entre abogados y otros juristas de reconocida competencia con más de quince años de ejercicio profesional."
  },
  {
    p: "¿Qué mayoría exige el artículo 122.3 CE para que el Congreso y el Senado propongan los cuatro vocales del CGPJ que corresponden a cada Cámara?",
    ops: ["Mayoría absoluta de sus miembros", "Mayoría de tres quintos de sus miembros", "Mayoría de dos tercios de sus miembros", "Mayoría simple de los miembros presentes"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 122.3 CE exige que los cuatro vocales propuestos por el Congreso y los cuatro propuestos por el Senado sean elegidos «por mayoría de tres quintos de sus miembros». Esta mayoría reforzada busca garantizar que los candidatos gocen de amplio consenso político."
  },
  {
    p: "El artículo 123 CE regula el Tribunal Supremo. ¿Cómo lo define la Constitución y cuál es su única excepción?",
    ops: ["Es el órgano jurisdiccional superior en todos los órdenes sin excepción alguna", "Es el órgano jurisdiccional superior en todos los órdenes, salvo lo dispuesto en materia de garantías constitucionales", "Es el órgano de unificación de doctrina judicial en todos los órdenes jurisdiccionales", "Es el máximo tribunal de casación en materia civil, penal y contencioso-administrativa"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 123.1 CE define al Tribunal Supremo como «el órgano jurisdiccional superior en todos los órdenes, salvo lo dispuesto en materia de garantías constitucionales». La excepción se refiere al Tribunal Constitucional, que es el supremo intérprete de la Constitución (art. 1 LOTC)."
  },
  {
    p: "¿Cómo se nombra al Presidente del Tribunal Supremo según el artículo 123.2 CE?",
    ops: ["Es elegido por los propios magistrados del Tribunal Supremo en votación secreta", "Es nombrado por el Rey, a propuesta del Consejo General del Poder Judicial, en la forma que determine la ley", "Es designado por el Gobierno con refrendo del Ministro de Justicia y ratificación del Congreso", "Es nombrado por las Cortes Generales en sesión conjunta por mayoría de tres quintos"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 123.2 CE establece que «el Presidente del Tribunal Supremo será nombrado por el Rey, a propuesta del Consejo General del Poder Judicial, en la forma que determine la ley». Intervienen así el CGPJ (que propone) y el Rey (que nombra formalmente)."
  },

    ops: ["Sí, todas las sentencias del TC tienen eficacia general frente a todos", "No, porque es una sentencia que se limita a la estimación subjetiva de un derecho (o a su denegación) y no declara la inconstitucionalidad de ninguna norma", "Solo si el TC así lo establece expresamente en el fallo de la sentencia desestimatoria", "Sí, pero solo respecto a los órganos judiciales que tramitaron el proceso previo"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 164.1 CE establece que tienen plenos efectos frente a todos las sentencias que declaren la inconstitucionalidad de una norma con rango de ley «y todas las que no se limiten a la estimación subjetiva de un derecho». Una sentencia desestimatoria de amparo se limita precisamente a resolver la pretensión subjetiva del recurrente, sin eficacia erga omnes."
  },
  {
    p: "¿Cuál es la principal diferencia de posición institucional entre el Tribunal Supremo (art. 123 CE) y el Tribunal Constitucional (art. 159 CE)?",
    ops: ["El TS pertenece al Poder Judicial; el TC es también un órgano judicial pero de rango superior al TS en todos los órdenes", "El TS es el órgano jurisdiccional superior en todos los órdenes salvo en garantías constitucionales; el TC es el supremo intérprete de la CE, ajeno al Poder Judicial ordinario", "Ambos forman parte del Poder Judicial pero con jurisdicciones diferenciadas: penal para el TS y constitucional para el TC", "El TC depende de las Cortes Generales; el TS depende del CGPJ; ambos están fuera del Poder Ejecutivo"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El TS (art. 123 CE) es el órgano superior del Poder Judicial ordinario, pero cede esa supremacía en materia de garantías constitucionales. El TC (art. 1 LOTC y Título IX CE) es el supremo intérprete de la Constitución, un órgano constitucional autónomo distinto del Poder Judicial, que resuelve sobre la constitucionalidad de las normas y la protección de los derechos fundamentales."
  },
  {
    p: "¿Qué ocurre con la jurisprudencia previa cuando el TC declara inconstitucional una norma jurídica con rango de ley interpretada por los tribunales, según el artículo 161.1.a) CE?",
    ops: ["Toda la jurisprudencia relacionada con esa norma queda automáticamente anulada", "La declaración de inconstitucionalidad afecta a la jurisprudencia basada en esa norma, si bien las sentencias ya recaídas no perderán el valor de cosa juzgada", "La jurisprudencia sigue siendo válida porque las sentencias individuales no pueden revisarse por el TC", "Solo se anula la jurisprudencia del Tribunal Supremo, no la de los Tribunales inferiores"],
    c: 1,
    exp: "<strong>Respuesta correcta: B.</strong> El art. 161.1.a) CE establece que «la declaración de inconstitucionalidad de una norma jurídica con rango de ley, interpretada por la jurisprudencia, afectará a ésta, si bien la sentencia o sentencias recaídas no perderán el valor de cosa juzgada». Se afecta la jurisprudencia futura pero se respetan las situaciones ya consolidadas por sentencias firmes."
  }
];

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function prepararPreguntas(){const m=shuffle(BANCO);return m.map(q=>{const ct=q.ops[q.c];const no=shuffle(q.ops);return{p:q.p,ops:no,c:no.indexOf(ct),exp:q.exp};});}

let preguntas=[],respondidas=0,correctas=0,incorrectas=0;

function actualizarBarra(){
  const pct=preguntas.length?(respondidas/preguntas.length)*100:0;
  document.getElementById('barraFill').style.width=pct+'%';
  document.getElementById('barraNum').textContent=respondidas+' / '+preguntas.length;
  document.getElementById('scoreOk').textContent='✓ '+correctas;
  document.getElementById('scoreKo').textContent='✗ '+incorrectas;
}
function responder(qi,oi){
  const q=preguntas[qi];
  const btns=document.querySelectorAll('[data-qi="'+qi+'"]');
  btns.forEach(b=>b.disabled=true);
  btns.forEach((b,j)=>{if(j===q.c)b.classList.add('correcta');else if(j===oi&&oi!==q.c)b.classList.add('incorrecta');});
  document.getElementById('exp-'+qi).classList.add('visible');
  respondidas++;
  if(oi===q.c)correctas++;else incorrectas++;
  actualizarBarra();
  if(respondidas===preguntas.length)setTimeout(mostrarResultado,700);
}
function mostrarResultado(){
  const pct=Math.round((correctas/preguntas.length)*100);
  document.getElementById('resPunt').innerHTML=correctas+' <span>/ '+preguntas.length+'</span>';
  document.getElementById('resCorr').textContent=correctas;
  document.getElementById('resIncorr').textContent=incorrectas;
  document.getElementById('resPct').textContent=pct+'%';
  let txt,col,bg;
  if(pct>=90){txt='🏆 Sobresaliente';col='#166534';bg='#f0fdf4';}
  else if(pct>=75){txt='✅ Notable';col='#1e3a5f';bg='#eff6ff';}
  else if(pct>=60){txt='📘 Aprobado';col='#92400e';bg='#fffbeb';}
  else{txt='❌ Insuficiente — ¡Sigue practicando!';col='#991b1b';bg='#fef2f2';}
  document.getElementById('resCalif').innerHTML='<span class="calif-badge" style="background:'+bg+';color:'+col+'">'+txt+'</span>';
  const el=document.getElementById('resultado');
  el.classList.add('visible');
  el.scrollIntoView({behavior:'smooth',block:'center'});
}
function render(){
  respondidas=0;correctas=0;incorrectas=0;
  preguntas=prepararPreguntas();
  actualizarBarra();
  const main=document.getElementById('mainContent');
  main.innerHTML='';
  const letras=['A','B','C','D'];
  preguntas.forEach((q,i)=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=
      '<div class="card-num">Pregunta '+(i+1)+' de '+preguntas.length+'</div>'+
      '<div class="card-pregunta">'+q.p+'</div>'+
      '<div class="opciones">'+
      q.ops.map((op,j)=>'<button class="opcion" data-qi="'+i+'" onclick="responder('+i+','+j+')"><span class="letra">'+letras[j]+')</span><span>'+op+'</span></button>').join('')+
      '</div>'+
      '<div class="explicacion" id="exp-'+i+'">'+q.exp+'</div>';
    main.appendChild(card);
  });
  const sep=document.createElement('div');sep.className='divider';sep.textContent='Fin del test';main.appendChild(sep);
  const res=document.createElement('div');res.className='resultado';res.id='resultado';
  res.innerHTML=
    '<div class="resultado-eyebrow">Resultado final</div>'+
    '<h2>Test completado</h2>'+
    '<div class="resultado-nota" id="resPunt">0 <span>/ 50</span></div>'+
    '<div id="resCalif"></div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-num" id="resCorr" style="color:#166534">0</div><div class="stat-lab">Correctas</div></div>'+
    '<div class="stat"><div class="stat-num" id="resIncorr" style="color:#991b1b">0</div><div class="stat-lab">Incorrectas</div></div>'+
    '<div class="stat"><div class="stat-num" id="resPct">0%</div><div class="stat-lab">% aciertos</div></div>'+
    '</div>'+
    '<p class="resultado-hint">Desplázate hacia arriba para revisar las explicaciones de cada pregunta.</p>'+
    '<button class="btn btn-naranja" onclick="render();window.scrollTo({top:0,behavior:\'smooth\'})">↺ Repetir con nuevo orden</button>';
  main.appendChild(res);
}
render();
</script>
